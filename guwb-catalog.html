<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <title>U-Shape Winged Bracket (GUWB) – PDF-like Template</title>
  <link rel="stylesheet" href="catalog-common.css">

        <link rel="stylesheet" href="navbar.css">
</head>
<body>
  
    <!-- Navigation Bar (Loaded from navbar.html) -->
    <div id="navbar-placeholder"></div>
<main class="canvas">
    <div class="title-row">
      <div class="title">U-Shape Winged Bracket (GUWB)</div>
    </div>

    <section class="meta-2">
      <div class="card">
        <h3>Specification</h3>
        <ul id="spec-list">
          <li>➤Material: S250GD/S235JR</li>
          <li>Surface: ➤Electro-galvanized (Z-275)</li>
          <li>➤Hot-dip galvanized</li>
          <li>➤Epoxy coated</li>
          <li>➤Stainless Steel A2/A4</li>
        </ul>
      </div>
      <div class="def-box">
        <h3 style="margin:0 0 6px;color:var(--green-dark)">Product Definition</h3>
        <p id="definition">Loading definition...</p>
      </div>
    </section>

    <section>
      <div id="grid" class="grid" aria-label="U-Shape winged bracket variants grid">
        <!-- items injected here -->
      </div>
    </section>

    <section class="table-wrap">
      <table class="props" id="guwb-table">
        <thead>
          <tr>
            <th>Product Code</th>
            <th>Detail</th>
            <th>Dimensions</th>
            <th>Load</th>
            <th>For Profile</th>
            <th>Weight</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    async function loadData(){
      const res = await fetch('data/guwb-catalog.json');
      if(!res.ok) throw new Error('Failed to load catalog data');
      return await res.json();
    }

    function renderGrid(items){
      const grid = document.getElementById('grid');
      grid.innerHTML = items.map(it=>`
        <div class="item">
          <span class="tick">✓</span>
          <img src="${it.image || 'assets/img/placeholder.png'}" alt="${it.code}">
          <div class="code">${it.code}</div>
        </div>
      `).join('');
    }

    function renderTable(rows){
      const tbody = document.querySelector('#guwb-table tbody');
      tbody.innerHTML = rows.map(r=>`
        <tr>
          <td>${r['Product Code']||'-'}</td>
          <td>${r['Detail']||'-'}</td>
          <td>${r['Dimensions']||'-'}</td>
          <td>${r['Load']||'-'}</td>
          <td>${r['For Profile']||'-'}</td>
          <td>${r['Weight']||'-'}</td>
        </tr>
      `).join('');
    }

    (async function init(){
      const data = await loadData();
      document.querySelector('.title').textContent = data.title || "U-Shape Winged Bracket (GUWB)";
      document.title = (data.title || "U-Shape Winged Bracket (GUWB)") + " – GREEN MAN";

      // spec
      if(Array.isArray(data.specification)){
        const ul = document.getElementById('spec-list'); ul.innerHTML = data.specification.map(s=>`<li>${s}</li>`).join('');
      }
      if(data.definition){ document.getElementById('definition').textContent = data.definition; }
      if(data.page){ document.getElementById('page-no').textContent = 'PAGE '+data.page; }

      renderGrid(data.items || []);
      renderTable(data.table || []);
    })();
  </script>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Load Components -->
    <script>
        Promise.all([
            fetch('navbar.html').then(r => r.text()),
            fetch('footer.html').then(r => r.text())
        ]).then(([navbarData, footerData]) => {
            const navbarPlaceholder = document.getElementById('navbar-placeholder');
            const footerPlaceholder = document.getElementById('footer-placeholder');
            
            if (navbarPlaceholder) navbarPlaceholder.innerHTML = navbarData;
            if (footerPlaceholder) footerPlaceholder.innerHTML = footerData;
            
            // Load navbar JavaScript AFTER HTML is injected
            const navScript = document.createElement('script');
            navScript.src = 'navbar.js';
            navScript.defer = true;
            navScript.onload = function() {
                document.body.classList.add('loaded');
            };
            navScript.onerror = function() {
                document.body.classList.add('loaded'); // Still show page even if nav fails
            };
            document.body.appendChild(navScript);
        }).catch(error => {
            console.error('Error loading components:', error);
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
